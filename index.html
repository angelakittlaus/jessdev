<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JessDEV.</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #e8e3ea;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(105, 55, 110, 0.18),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 0% 100%,
                    rgba(70, 30, 80, 0.14),
                    transparent 35%
                ),

                #09090b;

            overflow-x: hidden;
            overflow-y: auto;

            padding: 30px 0;
        }

        body::before {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            background:
                rgba(125, 70, 130, 0.08);

            filter: blur(120px);

            border-radius: 50%;

            top: -250px;
            right: -200px;

            pointer-events: none;

            z-index: 0;
        }

        .caveiras {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 1;
        }

        .caveiras span {

            position: fixed;

            top: -30px;

            user-select: none;

            pointer-events: none;

            text-shadow:
                0 0 8px rgba(167, 123, 178, 0.15);
        }

        @keyframes cair {

            from {

                transform:
                    translateY(-30px)
                    rotate(0deg);

                opacity: 0;
            }

            10% {

                opacity: 1;
            }

            90% {

                opacity: 0.5;
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }

        .card {

            width: min(92%, 440px);

            padding: 28px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 24px;

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.55);

            position: relative;

            z-index: 2;
        }

        .linha {

            width: 35px;
            height: 2px;

            background:
                #a77bb2;

            margin-bottom: 18px;

            opacity: 0.8;
        }

        .titulo {

            margin: 0;

            font-size: 25px;

            font-weight: 400;

            letter-spacing: -0.5px;

            color:
                #f1edf2;
        }

        .subtitulo {

            margin-top: 7px;

            margin-bottom: 24px;

            font-size: 12px;

            color:
                #8f8891;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .gif-container {

            width: 100%;

            height: 220px;

            overflow: hidden;

            border-radius: 17px;

            background:
                #111114;

            border:
                1px solid
                rgba(255,255,255,0.07);

            margin-bottom: 22px;

            position: relative;
        }

        .gif-container::after {

            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    to top,
                    rgba(0,0,0,0.3),
                    transparent 45%
                );

            pointer-events: none;
        }

        .gif-container img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }

        .informacoes {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 22px;
        }

        .info {

            padding: 13px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.06);

            transition:
                all 0.25s ease;
        }

        .info:hover {

            background:
                rgba(167,123,178,0.08);

            border-color:
                rgba(167,123,178,0.20);

            transform:
                translateY(-2px);
        }

        .info-titulo {

            display: block;

            font-size: 9px;

            color:
                #756e78;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 5px;
        }

        .info-texto {

            display: block;

            font-size: 13px;

            color:
                #ddd7df;
        }

        .dragonbot {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px;

            margin-bottom: 22px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(167,123,178,0.08),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid
                rgba(167,123,178,0.15);
        }

        .dragon-icon {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(167,123,178,0.10);

            border:
                1px solid
                rgba(167,123,178,0.20);

            font-size: 20px;

            flex-shrink: 0;
        }

        .dragon-info {

            min-width: 0;
        }

        .dragon-nome {

            font-size: 14px;

            color:
                #eee9ef;

            margin-bottom: 3px;
        }

        .dragon-descricao {

            font-size: 10px;

            color:
                #77717a;

            letter-spacing: 0.3px;
        }

        .musica-nome {

            font-size: 16px;

            color:
                #ddd7df;

            margin-bottom: 12px;

            letter-spacing: 0.2px;
        }

        audio {

            width: 100%;

            height: 40px;

            margin-bottom: 15px;

            opacity: 0.85;
        }

        .botao {

            width: 100%;

            padding: 12px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            background:
                rgba(255,255,255,0.045);

            color:
                #dcd6df;

            font-size: 13px;

            cursor: pointer;

            transition:
                all 0.25s ease;
        }

        .botao:hover {

            background:
                rgba(167,123,178,0.12);

            border-color:
                rgba(167,123,178,0.35);

            transform:
                translateY(-1px);
        }

        .rodape {

            margin-top: 20px;

            text-align: center;

            font-size: 10px;

            color:
                #625d64;

            letter-spacing: 1.5px;
        }

        @media (max-width: 480px) {

            body {

                padding:
                    20px 0;
            }

            .card {

                padding: 22px;

            }

            .gif-container {

                height: 200px;
            }

            .titulo {

                font-size: 23px;
            }

            .informacoes {

                grid-template-columns:
                    1fr 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="caveiras"></div>

    <main class="card">

        <div class="linha"></div>

        <h1 class="titulo">

            JessDEV.

        </h1>

        <div class="subtitulo">

            FEAR THE NAME. REMEMBER THE FACE.

        </div>

        <div class="gif-container">

            <img
                src="foto.jpg"
                alt="Foto de JessDEV."
            >

        </div>

        <div class="informacoes">

            <div class="info">

                <span class="info-titulo">
                    Cargo
                </span>

                <span class="info-texto">
                    Dona do DragonBot
                </span>

            </div>

            <div class="info">

                <span class="info-titulo">
                    Área
                </span>

                <span class="info-texto">
                    Desenvolvimento
                </span>

            </div>

            <div class="info">

                <span class="info-titulo">
                    Projeto
                </span>

                <span class="info-texto">
                    DragonBot
                </span>

            </div>

            <div class="info">

                <span class="info-titulo">
                    Linguagem
                </span>

                <span class="info-texto">
                    JavaScript
                </span>

            </div>

        </div>

        <div class="dragonbot">

            <div class="dragon-icon">

                🐉

            </div>

            <div class="dragon-info">

                <div class="dragon-nome">

                    DragonBot

                </div>

                <div class="dragon-descricao">

                    WhatsApp Bot · Desenvolvimento independente

                </div>

            </div>

        </div>

        <div class="musica-nome">

            A Touch Of Class - Around the World (La La La La La)

        </div>

        <audio
            id="musica"
            controls
        >

            <source
                src="musica.mp3"
                type="audio/mpeg"
            >

            Seu navegador não suporta áudio.

        </audio>

        <button
            class="botao"
            onclick="tocarMusica()"
        >

            ▶ Reproduzir

        </button>

        <div class="rodape">

            © JESS · ALL RIGHTS RESERVED

        </div>

    </main>

    <script>

        const musica =
            document.getElementById("musica");

        window.addEventListener("load", () => {

            musica.volume = 0.7;

            musica.play().catch(() => {

                console.log(
                    "Autoplay bloqueado. Aguardando interação."
                );

            });

        });

        function tocarMusica() {

            if (musica.paused) {

                musica.play();

            } else {

                musica.pause();

            }

        }

        const caveiras =
            document.querySelector(".caveiras");

        function criarCaveira() {

            const caveira =
                document.createElement("span");

            caveira.innerHTML = "💵";

            caveira.style.left =
                Math.random() * 100 + "vw";

            caveira.style.fontSize =
                (10 + Math.random() * 14) + "px";

            caveira.style.color =
                "rgba(170, 130, 180, 0.18)";

            const duracao =
                7 + Math.random() * 8;

            caveira.style.animation =
                `cair ${duracao}s linear forwards`;

            caveiras.appendChild(caveira);

            setTimeout(() => {

                caveira.remove();

            }, duracao * 1000);

        }

        setInterval(
            criarCaveira,
            700
        );

    </script>

</body>

</html>
